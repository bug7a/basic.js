                <h1>Build web interfaces with plain JavaScript.</h1>
                <p>basic.js creates the page objects for you. No HTML markup, no CSS files, no build step: write one function and open the page in a browser.</p>
                <p>12 KB gzipped · 0 dependencies · No build step · Apache 2.0</p>
                <h2>Keep simple things simple</h2>
                <ul>
                    <li><b>Reads like the screen.</b> The code of a screen follows its layout: a group, a title, a button. You understand it at a glance, months later too.</li>
                    <li><b>Small and dependency-free.</b> One 12 KB file works directly on the DOM. No framework runtime, no virtual DOM, no node_modules.</li>
                    <li><b>No build step.</b> Add a script tag, save, refresh. There is nothing to compile, bundle or configure.</li>
                    <li><b>Full control in one place.</b> Layout, style and behavior live together in JavaScript, so there is no markup and stylesheet to keep in sync.</li>
                </ul>
                <h2>The same card, two ways</h2><p>With HTML and CSS a screen is split into markup, styles and scripts that must stay in sync. With basic.js it is one function that reads like the screen.</p>
                <h2>Everything you need fits on one screen</h2><p>basic.js has a handful of concepts. Learn them once and you can read any page built with it.</p>
                <ul>
                    <li><b>Objects.</b> Box, Label, Button, Input and Icon. Settings go in one object; positions (left, top, width, height) can come first.</li>
                    <li><b>that.</b> The object created last. Style it right after you create it, without a variable.</li>
                    <li><b>Containers.</b> Objects created between startBox() and endBox() go inside that box. Every start has its end.</li>
                    <li><b>AutoLayout.</b> HGroup and VGroup place their objects in a row or a column, with gap, padding and alignment.</li>
                    <li><b>Events.</b> on("click", ...) on any object. The handler gets the object itself and the event.</li>
                    <li><b>Motion.</b> Tell an object what to animate with setMotion(), then just change its properties.</li>
                </ul>
                <h2>Start in three steps</h2>
                <ol>
                    <li><b>Get the basic folder.</b> Copy the basic folder (basic.min.js, basic.min.css and the font folder) next to your page.</li>
                    <li><b>Create a page.</b> Load the two files, then your own script. The body stays empty.</li>
                    <li><b>Write start().</b> basic.js creates the page and calls start(). Open the file in a browser, or with VS Code Live Server.</li>
                </ol>
                <h2>More than a library</h2><p>basic.js comes with a handbook, a component suite and ready app templates, all written with the same few ideas.</p>
                <ul>
                    <li><a href="https://bug7a.github.io/basic.js-handbook/" style="color: inherit;">Handbook</a>: 16 chapters, from the first Box to motion and utilities. Every example runs in the page.</li>
                    <li><a href="https://bug7a.github.io/js-components/" style="color: inherit;">Components</a>: 72 ready components: tabs, tables, date pickers, charts, toasts, modals… each with a live example and its code.</li>
                    <li><a href="https://github.com/bug7a/js-components/tree/main/04-template-m2/js-admin-panel" style="color: inherit;">App templates</a>: A modular admin panel, an installable PWA shell and forms that post to a service. Start from a working app.</li>
                    <li><a href="https://github.com/bug7a/js-components/tree/main/__developer-toolkit" style="color: inherit;">VS Code tools</a>: Extensions for basic.js: code completion, an object navigator and a view inspector.</li>
                </ul>
