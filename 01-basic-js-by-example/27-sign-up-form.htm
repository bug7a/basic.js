<!DOCTYPE html>
<html lang="en">
    <head>

        <title>Sign Up Form</title>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- LIBRARY FILES: basic.css and basic.js come first, your own code after them -->
        <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="../basic/basic.css">
        <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>

        <script>

        /*

        SIGN UP FORM

        A form that checks what the user writes, and shows what is wrong under the field.

        - Input({ inputType, placeholder, maxLength })
                                        -> inputType: "text", "email", "password"... maxLength: the most letters.
        - input.on("input" / "focus" / "blur", fn)
                                        -> fn runs while the user writes / when the field gets the focus / leaves it.
        - input.onEnter(fn), focus()    -> Enter goes to the next field. On the last field it sends the form.
        - A field shows its error only after the user leaves it (blur), or presses the button.
        - The "Show" button             -> inputType "password" (dots) <-> "text" (letters).
        - The strength bar              -> setMotion("width 0.25s"): its width ("0%" ... "100%") changes slowly.
        - button.enabled = 0            -> no second click while the form is sent.
        - show() / hide()               -> the form, then the "Welcome" card.
        - await basic.sleep(ms)         -> waits. Nothing is sent to a server: the page only waits a moment.

        TRY: add a rule to SignUp.checkPassword(), Ex: at least one capital letter (/[A-Z]/).

        */

        // *** VARIABLES:

        const CARD_WIDTH = 400;
        const PAGE_PADDING = 16;        // the space at the left and the right of the cards on a narrow screen

        const MIN_NAME_LENGTH = 2;
        const MIN_PASSWORD_LENGTH = 8;

        // something@something.something (a simple check: a server checks it better)
        const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        const SEND_TIME = 1200;         // ms: the page waits as if a server was answering

        const COLOR_ACCENT = "#5B6CD9";
        const COLOR_ERROR = "#D0473A";
        const COLOR_BORDER = Black(0.2);

        // WHY: The page helpers are in one object, so their names can not clash with basic.js.
        const SignUp = {};

        SignUp.fields = [];     // [nameField, emailField, passwordField, repeatField]

        let formCard, successCard, welcomeLabel, sendButton;
        let nameField, emailField, passwordField, repeatField;
        let strengthFill, strengthLabel;

        // *** START:

        const start = function () {

            page.color = "#ECEEF6";

            // BOX: The page never scrolls, this box does. (The form is taller than a phone screen.)
            startBox(0, 0, "100%", "100%", { color: "transparent", scrollY: 1 });

                VGroup({ width: "100%", height: "auto", align: "center top", padding: [PAGE_PADDING, 40] });

                    SignUp.createFormCard();
                    SignUp.createSuccessCard();

                endGroup();

            endBox();

            SignUp.fitCards();
            page.onResize(SignUp.fitCards);

            nameField.input.focus();

        };

        // *** CHECKS: Every check returns "" (OK) or the error text.

        SignUp.checkName = function (value) {
            if (value.trim().length < MIN_NAME_LENGTH) {
                return "Write your name. (At least " + MIN_NAME_LENGTH + " letters.)";
            }
            return "";
        };

        SignUp.checkEmail = function (value) {
            const email = value.trim();
            if (email === "") return "Write your e-mail address.";
            if (!EMAIL_PATTERN.test(email)) return "This is not an e-mail address.";
            return "";
        };

        SignUp.checkPassword = function (value) {
            if (value.length < MIN_PASSWORD_LENGTH) return "At least " + MIN_PASSWORD_LENGTH + " characters.";
            if (!/[0-9]/.test(value)) return "Add at least one number.";
            return "";
        };

        SignUp.checkRepeat = function (value) {
            if (value === "") return "Write the password again.";
            if (value !== passwordField.input.value) return "The passwords are not the same.";
            return "";
        };

        // *** VIEW:

        SignUp.createFormCard = function () {

            // GROUP: The form
            formCard = VGroup({
                width: CARD_WIDTH,
                height: "auto",
                align: "left top",
                gap: 18,
                padding: 28,
                color: "white",
                round: 16,
                boxShadow: "0 8px 24px rgba(0, 0, 0, 0.08)",
            });

                Label({ text: "Create an account", fontSize: 24, bold: 1, textColor: Black(0.8) });
                Label({ text: "It takes less than a minute.", fontSize: 15, textColor: Black(0.45) });

                nameField = SignUp.createField({
                    titleText: "Name",
                    placeholder: "Your name",
                    maxLength: 40,
                    check: SignUp.checkName,
                });

                emailField = SignUp.createField({
                    titleText: "E-mail",
                    placeholder: "name@example.com",
                    inputType: "email",
                    maxLength: 80,
                    check: SignUp.checkEmail,
                });

                passwordField = SignUp.createField({
                    titleText: "Password",
                    placeholder: MIN_PASSWORD_LENGTH + "+ characters, 1 number",
                    inputType: "password",
                    maxLength: 64,
                    check: SignUp.checkPassword,
                    withStrength: 1,
                });

                repeatField = SignUp.createField({
                    titleText: "Password again",
                    placeholder: "The same password",
                    inputType: "password",
                    maxLength: 64,
                    check: SignUp.checkRepeat,
                });

                // BUTTON: Send
                sendButton = Button({
                    text: "Create account",
                    width: "100%",
                    height: 48,
                    minimal: 1,
                    color: COLOR_ACCENT,
                    textColor: "white",
                    round: 10,
                    fontSize: 17,
                });
                sendButton.on("click", SignUp.send);

            endGroup();

            // WHY: When the password changes, "Password again" may be right or wrong now.
            passwordField.input.on("input", function () {
                if (repeatField.isTouched) SignUp.validate(repeatField);
            });

            // KEY: Enter goes to the next field, and sends the form on the last one.
            SignUp.fields.forEach(function (field, index) {
                field.input.onEnter(function () {
                    const nextField = SignUp.fields[index + 1];
                    if (nextField) {
                        nextField.input.focus();
                    } else {
                        SignUp.send();
                    }
                });
            });

        };

        // One field: its title, the input and the error text under it.
        SignUp.createField = function (params) {

            const field = {
                check: params.check,
                isTouched: 0,       // 1 after the user leaves the field. Its error is shown only then.
                isValid: 0,
                isFocused: 0,
            };

            // GROUP: Field
            VGroup({ width: "100%", height: "auto", align: "left top", gap: 6 });

                Label({ text: params.titleText, fontSize: 14, bold: 1, textColor: Black(0.6) });

                const inputProps = {
                    width: "100%",
                    height: 46,
                    fontSize: 16,
                    round: 8,
                    borderColor: COLOR_BORDER,
                    placeholder: params.placeholder,
                    inputType: params.inputType || "text",
                    maxLength: params.maxLength,
                };

                if (params.inputType === "password") {
                    SignUp.createPasswordRow(field, inputProps);
                } else {
                    field.input = Input(inputProps);
                }

                if (params.withStrength) SignUp.createStrengthBar();

                field.errorLabel = Label({ text: "", fontSize: 13, textColor: COLOR_ERROR });
                field.errorLabel.hide();

            endGroup();

            // EVENTS: The <input> element inside the Input gets them.
            field.input.on("focus", function () {
                field.isFocused = 1;
                SignUp.refreshBorder(field);
            });

            field.input.on("blur", function () {
                field.isFocused = 0;
                // WHY: An empty field that the user only passed through is not an error yet.
                if (field.input.value !== "") field.isTouched = 1;
                SignUp.validate(field);
            });

            field.input.on("input", function () {
                if (params.withStrength) SignUp.refreshStrength(field.input.value);
                SignUp.validate(field);
            });

            SignUp.fields.push(field);
            return field;

        };

        // GROUP: A password input and its "Show" button.
        SignUp.createPasswordRow = function (field, inputProps) {

            HGroup({ width: "100%", height: 46, gap: 8 });

                // { ...inputProps, width: 10, grow: 1 }: the same props, but its width grows into the free space.
                field.input = Input({ ...inputProps, width: 10, grow: 1 });

                field.showButton = Button({
                    text: "Show",
                    width: 70,
                    height: 46,
                    minimal: 1,
                    color: Black(0.05),
                    textColor: Black(0.6),
                    round: 8,
                    fontSize: 14,
                });
                field.showButton.on("click", function () {
                    const isVisible = (field.input.inputType === "text");
                    SignUp.setPasswordVisible(field, !isVisible);
                    field.input.focus();
                });

            endGroup();

        };

        // BOX: The bar under the password. Its fill is wider when the password is stronger.
        SignUp.createStrengthBar = function () {

            HGroup({ width: "100%", height: 16, gap: 10, align: "left center" });

                startBox({ width: 10, height: 6, grow: 1, color: Black(0.08), round: 3 });
                    strengthFill = Box(0, 0, "0%", "100%", { color: COLOR_ERROR, round: 3 });
                    strengthFill.setMotion("width 0.25s, background-color 0.25s");
                endBox();

                strengthLabel = Label({ text: "", width: 56, fontSize: 12, textColor: Black(0.45) });

            endGroup();

        };

        SignUp.createSuccessCard = function () {

            // GROUP: Shown after the form is sent
            successCard = VGroup({
                width: CARD_WIDTH,
                height: "auto",
                align: "center top",
                gap: 14,
                padding: 32,
                color: "white",
                round: 16,
                boxShadow: "0 8px 24px rgba(0, 0, 0, 0.08)",
            });

                // LABEL: A ✓ in a green circle
                Label({
                    text: "✓",
                    width: 64,
                    height: 64,
                    round: 32,
                    color: "#E4F4EA",
                    textColor: "#2E8B57",
                    fontSize: 30,
                    bold: 1,
                    textAlign: "center",
                    lineHeight: 64,     // WHY: One line as tall as the circle: the ✓ is in its middle.
                });

                welcomeLabel = Label({ text: "", fontSize: 22, bold: 1, textColor: Black(0.8) });

                Label({ text: "Your account is ready.", fontSize: 15, textColor: Black(0.5) });

                Button({
                    text: "Start again",
                    width: "auto",
                    height: 40,
                    padding: [18, 0],
                    minimal: 1,
                    color: "transparent",
                    textColor: COLOR_ACCENT,
                    round: 8,
                    border: 1,
                    borderColor: COLOR_ACCENT,
                });
                that.on("click", SignUp.reset);   // that: the object created last (the button)

            endGroup();

            // WHY: The children are created first, the group is hidden only now.
            successCard.hide();

        };

        // *** FUNCTIONS:

        // Checks one field. Shows the error only when the field is touched.
        SignUp.validate = function (field) {

            const message = field.check(field.input.value);
            field.isValid = (message === "") ? 1 : 0;

            if (field.isTouched && !field.isValid) {
                field.errorLabel.text = message;
                field.errorLabel.show();
            } else {
                field.errorLabel.hide();
            }

            SignUp.refreshBorder(field);
            return field.isValid;

        };

        // WHY: An inline borderColor wins over the :focus style of basic.css, so the focus color is set here too.
        SignUp.refreshBorder = function (field) {

            if (field.isTouched && !field.isValid) {
                field.input.borderColor = COLOR_ERROR;
                return;
            }

            field.input.borderColor = (field.isFocused) ? COLOR_ACCENT : COLOR_BORDER;

        };

        // "Hide": inputType "text" shows the letters. "Show": inputType "password" shows dots.
        SignUp.setPasswordVisible = function (field, isVisible) {
            field.input.inputType = (isVisible) ? "text" : "password";
            field.showButton.text = (isVisible) ? "Hide" : "Show";
        };

        // 0-4 points: the length, a number, upper and lower case letters, a symbol.
        SignUp.refreshStrength = function (password) {

            let score = 0;
            if (password.length >= MIN_PASSWORD_LENGTH) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
            if (/[^a-zA-Z0-9]/.test(password)) score++;

            const names = ["", "Weak", "Fair", "Good", "Strong"];
            const colors = [COLOR_ERROR, COLOR_ERROR, "#E0A030", "#6BAF5B", "#2E8B57"];

            strengthFill.width = (score * 25) + "%";      // 4 points: "100%"
            strengthFill.color = colors[score];
            strengthLabel.text = names[score];

        };

        SignUp.send = async function () {

            // WHY: Only one send at a time.
            if (sendButton.enabled === 0) return;

            // Every field shows its error now, also the ones the user did not visit.
            let firstWrongField = null;
            SignUp.fields.forEach(function (field) {
                field.isTouched = 1;
                const isValid = SignUp.validate(field);
                if (!isValid && !firstWrongField) firstWrongField = field;
            });

            if (firstWrongField) {
                firstWrongField.input.focus();
                return;
            }

            sendButton.enabled = 0;
            sendButton.text = "Creating account...";
            SignUp.fields.forEach(function (field) { field.input.enabled = 0; });

            // A real form would send the data to a server here, and wait for its answer.
            await basic.sleep(SEND_TIME);

            // WHY: The name comes from the user. plainText shows it as text, never as HTML.
            welcomeLabel.plainText = "Welcome, " + nameField.input.value.trim() + "!";

            formCard.hide();
            successCard.show();

        };

        SignUp.reset = function () {

            SignUp.fields.forEach(function (field) {
                field.input.value = "";
                field.input.enabled = 1;
                field.isTouched = 0;
                field.isValid = 0;
                field.errorLabel.hide();
                SignUp.refreshBorder(field);
                if (field.showButton) SignUp.setPasswordVisible(field, 0);
            });

            SignUp.refreshStrength("");

            sendButton.text = "Create account";
            sendButton.enabled = 1;

            successCard.hide();
            formCard.show();

            nameField.input.focus();

        };

        // The cards are narrower on a phone. (page.onResize runs it again when the window size changes.)
        SignUp.fitCards = function () {
            const width = Math.min(CARD_WIDTH, page.width - 2 * PAGE_PADDING);
            formCard.width = width;
            successCard.width = width;
        };

        </script>

    </head>
    <body>
    </body>
</html>
