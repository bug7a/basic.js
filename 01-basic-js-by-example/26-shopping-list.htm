<!DOCTYPE html>
<html lang="en">
    <head>

        <title>Shopping List</title>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- LIBRARY FILES: basic.css and basic.js come first, your own code after them -->
        <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="../basic/basic.css">
        <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>

        <script>

        /*

        SHOPPING LIST

        A list that the user changes, and that is still there after the page is reloaded.

        - Input({ placeholder }), onEnter(fn) -> a text field. Enter adds the item.
        - createIn(box, fn)                   -> creates objects in a box that was made before (the new rows).
        - obj.onHoverChange(fn)               -> a row gets a color while the mouse is over it.
        - obj.remove()                        -> deletes a row. The objects in it and their events go with it.
        - await obj.animate({ opacity }, ms)  -> fades a row in or out. await waits until the fade ends.
        - basic.storage.save() / loadOr()     -> keeps the list in localStorage. loadOr() gives a default list
                                                 when nothing is saved yet.
        - Label: plainText, ellipsis, grow    -> the text of the user as text (never as HTML), on one line
                                                 with "..." at the end, in the free space of the row.
        - Box({ scrollY: 1 })                 -> the list scrolls when it has more rows than its height.

        TRY: add more items than the list can show, then reload the page: the list is still there.

        */

        // *** VARIABLES:

        const STORAGE_KEY = "basic-samples-shopping-list";

        const CARD_WIDTH = 420;
        const PAGE_PADDING = 16;        // the space at the left and the right of the card on a narrow screen
        const LIST_HEIGHT = 320;

        const FADE_IN_TIME = 250;       // ms
        const FADE_OUT_TIME = 200;      // ms

        const COLOR_ACCENT = "#4F9A84";
        const COLOR_ROW_HOVER = "#EEF5F2";

        // The data: [{ text: "Milk", done: 0 }, ...]. The rows only show it.
        let items = [];

        let card, input, listBox, list, emptyLabel, countLabel;

        // *** START:

        const start = function () {

            page.color = "#E9ECEB";

            // WHY: The first time nothing is saved, so the list starts with a few items.
            items = basic.storage.loadOr(STORAGE_KEY, [
                { text: "Bread", done: 0 },
                { text: "Milk", done: 1 },
                { text: "Tomatoes (1 kg)", done: 0 },
            ]);

            // BOX: The page never scrolls, this box does. (The card can be taller than the screen.)
            startBox(0, 0, "100%", "100%", { color: "transparent", scrollY: 1 });

                VGroup({ width: "100%", height: "auto", align: "center top", padding: [PAGE_PADDING, 40] });

                    createCard();

                endGroup();

            endBox();

            // One row for every saved item.
            items.forEach(function (item) { addRow(item); });
            refresh();

            fitCard();
            page.onResize(fitCard);

            input.focus();

        };

        // *** VIEW:

        const createCard = function () {

            // GROUP: The card
            card = VGroup({
                width: CARD_WIDTH,
                height: "auto",
                align: "left top",
                gap: 16,
                padding: 24,
                color: "white",
                round: 16,
                boxShadow: "0 8px 24px rgba(0, 0, 0, 0.08)",
            });

                Label({ text: "Shopping List", fontSize: 24, bold: 1, textColor: Black(0.75) });

                // GROUP: New item
                HGroup({ width: "100%", height: 44, gap: 8 });

                    // width: 10 is only a start: grow: 1 gives the input the space the button leaves.
                    input = Input({
                        width: 10,
                        height: 44,
                        grow: 1,
                        placeholder: "Add an item...",
                        maxLength: 60,
                        fontSize: 16,
                    });
                    input.onEnter(addFromInput);

                    Button({
                        text: "Add",
                        width: 80,
                        height: 44,
                        minimal: 1,
                        color: COLOR_ACCENT,
                        textColor: "white",
                        round: 8,
                    });
                    that.on("click", addFromInput);   // that: the object created last (the button)

                endGroup();

                // BOX: The list. It scrolls when it has more rows than its height.
                listBox = startBox({ width: "100%", height: LIST_HEIGHT, color: "#F5F7F6", round: 10, scrollY: 1 });

                    // GROUP: The rows. (height: "auto": it can be taller than listBox, then listBox scrolls.)
                    list = VGroup({ width: "100%", height: "auto", align: "left top", gap: 4, padding: 8 });
                    endGroup();

                    emptyLabel = Label({ text: "The list is empty.", fontSize: 15, textColor: Black(0.35) });

                endBox();

                // GROUP: Footer
                HGroup({ width: "100%", height: 36, align: "center", justify: "space-between" });

                    countLabel = Label({ text: "", fontSize: 14, textColor: Black(0.45) });

                    Button({
                        text: "Clear done",
                        width: "auto",
                        height: 36,
                        padding: [14, 0],
                        minimal: 1,
                        color: "transparent",
                        textColor: COLOR_ACCENT,
                        round: 8,
                        border: 1,
                        borderColor: COLOR_ACCENT,
                    });
                    that.on("click", clearDone);

                endGroup();

            endGroup();

        };

        // One row: [check mark] text [✕]
        const addRow = function (item) {

            let row;

            // WHY: The list was made before (in createCard). createIn() creates the new row in it.
            createIn(list, function () {

                // GROUP: A row. A click anywhere on it checks the item.
                row = HGroup({
                    width: "100%",
                    height: 48,
                    align: "left center",
                    gap: 12,
                    padding: [12, 0],
                    color: "white",
                    round: 8,
                    clickable: 1,
                    cursor: "pointer",
                });

                    row.checkMark = Label({
                        text: "",
                        width: 22,
                        height: 22,
                        shrink: 0,              // WHY: In a group it could get narrower. It keeps 22.
                        round: 6,
                        border: 2,
                        textColor: "white",
                        fontSize: 14,
                        bold: 1,
                        textAlign: "center",
                        lineHeight: 18,         // WHY: 22 - 2 x the border (2): the ✓ is in the middle of the box.
                    });

                    row.textLabel = Label({ width: 10, grow: 1, ellipsis: 1, fontSize: 16 });
                    // WHY: The text comes from the user. .text is HTML ("<b>" makes it bold).
                    //      .plainText shows "<b>" as it is.
                    row.textLabel.plainText = item.text;

                    row.deleteButton = Button({
                        text: "✕",
                        width: 32,
                        height: 32,
                        minimal: 1,
                        color: "transparent",
                        textColor: Black(0.35),
                        round: 16,
                        fontSize: 14,
                        aria: { label: "Delete" },   // WHY: A button with only a symbol: a screen reader says "Delete".
                    });

                endGroup();

            });

            row.item = item;
            paintRow(row);

            row.onHoverChange(function (self, isOver) {
                self.color = (isOver) ? COLOR_ROW_HOVER : "white";
            });

            row.on("click", toggleDone);

            row.deleteButton.on("click", function (self, event) {
                // WHY: The button is in the row. Without this, the click goes on to the row and checks the item too.
                event.stopPropagation();
                deleteRow(row);
            });

            return row;

        };

        // The look of a row: done (checked and struck through) or not.
        const paintRow = function (row) {

            const isDone = row.item.done;

            row.checkMark.text = (isDone) ? "✓" : "";
            row.checkMark.color = (isDone) ? COLOR_ACCENT : "white";
            row.checkMark.borderColor = (isDone) ? COLOR_ACCENT : Black(0.25);

            row.textLabel.textColor = (isDone) ? Black(0.35) : Black(0.75);
            // (basic.js has no prop for a line through the text, so css writes it.)
            row.textLabel.css.textDecoration = (isDone) ? "line-through" : "none";

        };

        // *** DATA:

        const addFromInput = function () {

            const text = input.value.trim();

            if (text === "") {
                input.focus();
                return;
            }

            const item = { text: text, done: 0 };
            items.push(item);
            save();

            // A new row fades in.
            const row = addRow(item);
            row.opacity = 0;
            row.animate({ opacity: 1 }, FADE_IN_TIME);

            input.value = "";
            input.focus();

            refresh();

            // Shows the new row: the list scrolls to its end. (basic.js has no prop for the scroll position.)
            listBox.elem.scrollTop = listBox.elem.scrollHeight;

        };

        // A click on a row: done <-> not done.
        const toggleDone = function (row) {
            row.item.done = (row.item.done) ? 0 : 1;
            paintRow(row);
            save();
            refresh();
        };

        const deleteRow = async function (row) {

            // WHY: A row that is fading out is not deleted again (a second click on ✕, or "Clear done").
            if (row.isDeleting) return;
            row.isDeleting = 1;
            row.clickable = 0;                       // WHY: It can not be checked while it fades out.

            items = items.filter(function (item) { return item !== row.item; });
            save();

            await row.animate({ opacity: 0 }, FADE_OUT_TIME);
            row.remove();                            // Its check mark, label and button go with it.

            refresh();

        };

        const clearDone = function () {
            list.children.forEach(function (row) {
                if (row.item.done) deleteRow(row);
            });
        };

        const save = function () {
            basic.storage.save(STORAGE_KEY, items);
        };

        // The counter and the empty text.
        const refresh = function () {

            const doneCount = items.filter(function (item) { return item.done; }).length;
            const itemWord = (items.length === 1) ? "item" : "items";
            countLabel.text = items.length + " " + itemWord + ", " + doneCount + " done";

            refreshEmptyLabel();

        };

        // "The list is empty." in the middle of the list box, only when there is no item.
        const refreshEmptyLabel = function () {

            // WHY: The data decides, not list.children: a deleted row is still in the list while it fades out.
            if (items.length > 0) {
                emptyLabel.hide();
                return;
            }

            emptyLabel.show();
            // WHY: center() measures the label, and a hidden label has no size: show() first, then center().
            emptyLabel.center();

        };

        // *** OTHER FUNCTIONS:

        // The card is narrower on a phone. (page.onResize runs it again when the window size changes.)
        const fitCard = function () {
            card.width = Math.min(CARD_WIDTH, page.width - 2 * PAGE_PADDING);
            refreshEmptyLabel();   // WHY: The list box changed its width too: the empty text is centered again.
        };

        </script>

    </head>
    <body>
    </body>
</html>
